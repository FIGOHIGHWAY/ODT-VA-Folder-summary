# Plain HTTP is disabled entirely (no listener on port 80) — only HTTPS is
# served. Requests to the bare IP or any host other than the registered
# hostname are dropped without a response (444), so the site is only
# reachable by its real hostname.

# Never advertise the nginx version in the Server header or on error pages —
# a scanner flags that as information disclosure and it helps an attacker match
# the build to known CVEs. Applies to every server block below.
server_tokens off;

server {
	listen 443 ssl default_server;
	http2 on;
	server_name _;
	ssl_certificate     /etc/nginx/certs/fullchain.pem;
	ssl_certificate_key /etc/nginx/certs/privkey.pem;
	return 444;
}

server {
	listen 443 ssl;
	http2 on;
	server_name odtstvascan.kku.ac.th odt-stvascan.kku.ac.th;

	ssl_certificate     /etc/nginx/certs/fullchain.pem;
	ssl_certificate_key /etc/nginx/certs/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers HIGH:!aNULL:!MD5;
	ssl_prefer_server_ciphers on;

	# Security response headers (sent on error responses too via `always`), to
	# clear the common scanner findings: no HSTS, missing anti-clickjacking,
	# MIME-sniffing and referrer-leak protections. CSP is intentionally left
	# out here — a wrong policy breaks the SvelteKit app, so set it only after
	# testing the exact sources the app loads.
	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	client_max_body_size 100m;

	# Parsing a large HTML export (or a ZIP with many of them) can take well
	# over nginx's 60s default before the app responds — raise the timeouts
	# so a big upload doesn't 504 while it's still legitimately processing.
	proxy_read_timeout 300s;
	proxy_send_timeout 300s;

	location / {
		proxy_pass http://app:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
