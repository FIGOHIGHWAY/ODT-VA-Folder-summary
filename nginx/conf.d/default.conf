# Plain HTTP is disabled entirely (no listener on port 80) — only HTTPS is
# served. Requests to the bare IP or any host other than the registered
# hostname are dropped without a response (444), so the site is only
# reachable by its real hostname.

server {
	listen 443 ssl default_server;
	http2 on;
	server_name _;
	ssl_certificate     /etc/nginx/certs/fullchain.pem;
	ssl_certificate_key /etc/nginx/certs/privkey.pem;
	return 444;
}

server {
	listen 443 ssl;
	http2 on;
	server_name odtstvascan.kku.ac.th odt-stvascan.kku.ac.th;

	ssl_certificate     /etc/nginx/certs/fullchain.pem;
	ssl_certificate_key /etc/nginx/certs/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers HIGH:!aNULL:!MD5;

	client_max_body_size 100m;

	# Parsing a large HTML export (or a ZIP with many of them) can take well
	# over nginx's 60s default before the app responds — raise the timeouts
	# so a big upload doesn't 504 while it's still legitimately processing.
	proxy_read_timeout 300s;
	proxy_send_timeout 300s;

	location / {
		proxy_pass http://app:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
