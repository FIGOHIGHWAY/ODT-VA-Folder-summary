# Weekly update PRs. Merging one to main auto-deploys it (see ops/README.md),
# so review the changelog first. Minor/patch npm bumps are grouped into one PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
