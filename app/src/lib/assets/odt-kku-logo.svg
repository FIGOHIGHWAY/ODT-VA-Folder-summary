<svg xmlns="http://www.w3.org/2000/svg" width="200" height="220" viewBox="0 0 200 220">
	<title>ODT KKU</title>
	<defs>
		<linearGradient id="band-blue" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#38bdf8" />
			<stop offset="1" stop-color="#2563eb" />
		</linearGradient>
		<linearGradient id="band-orange" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#fbbf24" />
			<stop offset="1" stop-color="#f97316" />
		</linearGradient>
		<linearGradient id="band-pink" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ec4899" />
			<stop offset="1" stop-color="#7c3aed" />
		</linearGradient>
		<linearGradient id="shield-fill" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#60a5fa" />
			<stop offset="1" stop-color="#1d4ed8" />
		</linearGradient>
	</defs>

	<!-- three ribbon bands forming a triangle -->
	<path d="M100 14 L142 92 L120 104 L100 66 L80 104 L58 92 Z" fill="url(#band-blue)" />
	<path d="M58 92 L100 168 L78 180 L36 104 Z" fill="url(#band-orange)" />
	<path d="M142 92 L184 168 L162 180 L120 104 Z" fill="url(#band-pink)" />
	<path d="M78 180 L36 104 L58 92 L100 168 Z" fill="url(#band-orange)" opacity="0.001" />

	<!-- shield + lock -->
	<g transform="translate(100,108)">
		<path
			d="M0 -30 L26 -18 L26 6 C26 26 14 38 0 44 C-14 38 -26 26 -26 6 L-26 -18 Z"
			fill="#f8fafc"
			stroke="#1d4ed8"
			stroke-width="3"
		/>
		<path
			d="M0 -24 L20 -14 L20 5 C20 21 11 31 0 36 C-11 31 -20 21 -20 5 L-20 -14 Z"
			fill="url(#shield-fill)"
		/>
		<rect x="-9" y="-2" width="18" height="15" rx="3" fill="#f8fafc" />
		<path d="M-6 -2 V-8 a6 6 0 0 1 12 0 V-2" fill="none" stroke="#f8fafc" stroke-width="4" />
	</g>

	<text
		x="100"
		y="206"
		text-anchor="middle"
		font-family="Segoe UI, Arial, sans-serif"
		font-weight="700"
		font-size="30"
	>
		<tspan fill="#0ea5e9">ODT</tspan>
		<tspan fill="#f59e0b"> KKU</tspan>
	</text>
</svg>
