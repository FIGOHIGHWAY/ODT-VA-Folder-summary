services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: va_scan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./app/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./app
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/va_scan
      ORIGIN: https://odtstvascan.kku.ac.th
      # SvelteKit's own request-body cap (separate from nginx's
      # client_max_body_size) — defaults to 512kb, must be raised to match.
      BODY_SIZE_LIMIT: 100M
    extra_hosts:
      # Lets the app reach the host's OpenVAS SSH tunnel (see
      # openvas-tunnel.service) at host.docker.internal:19390.
      - "host.docker.internal:host-gateway"
    volumes:
      # Dedicated key for SSH-ing into the Nuclei VM to run scans remotely
      # (see lib/server/nuclei.js) — Nuclei has no HTTP API of its own.
      - ./nuclei-keys:/keys/nuclei:ro
      # Forced-command key for the ZAP-VM DNS-pin helper (see lib/server/zap.js):
      # lets a scan resolve a vhost name to a chosen IP for its duration.
      - ./zap-keys:/keys/zap:ro
    depends_on:
      db:
        condition: service_healthy

  nginx:
    # Bumped off the 1.27 line for NGINX2Root / CVE-2026-123007 (HTTP/2
    # memory-corruption RCE, CVSSv4 9.2, disclosed 2026-11-18): every nginx
    # from 1.9.5 to 1.31.8 with HTTP/2 enabled is affected, and this proxy
    # runs `http2 on`. Fixed in the 1.30.7 / 1.31.9 releases; 1.30-alpine is
    # the patched stable line (currently 1.30.7) and keeps the floating tag so
    # refresh-images.sh still auto-pulls later patches. A `docker pull` is
    # required on deploy to fetch the fixed image.
    image: nginx:1.30-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  db_data:
